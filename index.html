<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descalce financiero diario</title>
<style>
  :root {
    --bg:#0a1220;
    --card:#0d1c30;
    --card-border:rgba(255,255,255,.08);
    --text:#eaf1fb;
    --muted:#8aa0bd;
    --line:rgba(255,255,255,.08);
    --zero:#8a9a4a;
    --neg:#dc2626;
    --pos:#16a34a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: Aptos, "Segoe UI", Arial, sans-serif;
  }
  .page {
    max-width:1600px;
    margin:0 auto;
    padding:28px;
  }
  h1 {
    margin:0 0 6px;
    font-size:22px;
    letter-spacing:.02em;
    font-weight:800;
    text-transform:uppercase;
    color:var(--text);
  }
  .sub {
    color:var(--muted);
    margin-bottom:22px;
    font-size:13px;
  }
  .chart-card {
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    overflow:hidden;
    position:relative;
  }
  .chart-card::before {
    content:"";
    display:block;
    height:4px;
    background:linear-gradient(90deg,#caa63a 0%, #4c9a4a 100%);
  }
  .month-band-even { fill: rgba(148,163,184,.055); }
  .month-band-odd { fill: rgba(148,163,184,.12); }
  .month-divider { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:4 4; }
  .peak-label {
    font-size:10px;
    font-weight:700;
    paint-order:stroke;
    stroke:#ffffff;
    stroke-width:3px;
    stroke-linejoin:round;
  }
  .chart-head {
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:center;
    padding:16px 18px 8px;
  }
  .legend {
    display:flex;
    gap:16px;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
  }
  .dot {
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:2px;
    margin-right:6px;
  }
  .chart-scroll {
    overflow-x:auto;
    overflow-y:hidden;
    border-top:1px solid var(--card-border);
  }
  #chart {
    display:block;
    min-height:560px;
  }
  .tooltip {
    position:fixed;
    pointer-events:none;
    opacity:0;
    z-index:100;
    background:#0d1c30;
    border:1px solid rgba(255,255,255,.15);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:12px;
    line-height:1.4;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transform:translate(10px,10px);
  }
  @media (max-width:900px) {
    .page { padding:14px; }
  }

  .exec-summary {
    margin-top:22px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:22px 24px 26px;
  }
  .exec-summary h2 {
    margin:0 0 4px;
    font-size:18px;
    letter-spacing:.02em;
    text-transform:uppercase;
    font-weight:800;
  }
  .exec-summary .exec-sub {
    color:var(--muted);
    font-size:12.5px;
    margin-bottom:18px;
  }
  .conclusion-box {
    background:rgba(255,255,255,.03);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:18px 20px;
    font-size:13px;
    line-height:1.6;
    color:var(--text);
  }
  .conclusion-box p { margin:0 0 10px; }
  .conclusion-box p:last-child { margin-bottom:0; }
  .conclusion-box b { color:#fca5a5; }
  .conclusion-risk {
    padding-top:8px;
    border-top:1px solid var(--card-border);
    color:var(--muted);
  }
  .exec-table-wrap {
    overflow-x:auto;
    border:1px solid var(--card-border);
    border-radius:10px;
    margin-bottom:16px;
  }
  .exec-table {
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  .exec-table th, .exec-table td {
    padding:9px 12px;
    border-bottom:1px solid var(--card-border);
    text-align:left;
    white-space:nowrap;
  }
  .exec-table th {
    background:rgba(255,255,255,.03);
    color:var(--muted);
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .exec-table tr:last-child td { border-bottom:0; }
  .exec-table tr.crit td { background:rgba(220,38,38,.10); }
  .neg-c { color:#f87171; font-weight:700; }
  .pos-c { color:#4ade80; font-weight:700; }
</style>
</head>

  const innerW = Math.max(1150, rows.length*(barW+gap) + 160);
  const width = innerW;

  const maxAbs = Math.max(...vals.map(v=>Math.abs(v)), 1);
  const topVal = Math.max(...vals, 0);
  const botVal = Math.min(...vals, 0);
  const topPad = Math.max(topVal*1.15, maxAbs*.15);
  const botPad = Math.min(botVal*1.15, -maxAbs*.15);
  const yMin = Math.min(Math.floor(botPad/250000000)*250000000, -Math.ceil(OVERDRAFT_LIMIT*1.1/250000000)*250000000);

    out += `<line x1="${margin.left}" y1="${yy}" x2="${width-margin.right}" y2="${yy}" stroke="#e5e7eb" stroke-width="1"/>`;

  const limitY = y(-OVERDRAFT_LIMIT);
  out += `<line x1="${margin.left}" y1="${limitY}" x2="${width-margin.right}" y2="${limitY}" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  out += `<text x="${width-margin.right-6}" y="${limitY-6}" text-anchor="end" font-size="11" font-weight="700" fill="#991b1b">Límite descubierto: ${fmtMoney(-OVERDRAFT_LIMIT)}</text>`;

  monthBounds.forEach((m, idx) => {
    const sx = x(m.start) - gap/2;
    const ex = x(m.end) + barW + gap/2;
    const bandClass = idx % 2 === 0 ? "month-band-even" : "month-band-odd";
    out += `<rect x="${sx}" y="${margin.top-12}" width="${Math.max(1,ex-sx)}" height="${height-margin.top-margin.bottom+20}" class="${bandClass}"/>`;

      const mr = rows.slice(m.start, m.end + 1);
      if (!mr.length) return;

      let localMax = mr[0], localMin = mr[0];
      mr.forEach(r => {
        if (r.value > localMax.value) localMax = r;
        if (r.value < localMin.value) localMin = r;
      });

      const maxIndex = rows.indexOf(localMax);
      const minIndex = rows.indexOf(localMin);

      if (showPos && localMax.value > 0) {
        const yy = y(localMax.value);
        const xx = x(maxIndex) + barW/2;
        out += `<circle cx="${xx}" cy="${yy}" r="4" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>`;
        out += `<text x="${xx}" y="${Math.max(42, yy-22)}" text-anchor="middle" fill="#15803d" class="peak-label">${localMax.label}</text>`;
        out += `<text x="${xx}" y="${Math.max(54, yy-10)}" text-anchor="middle" fill="#15803d" class="peak-label">${fmtMoney(localMax.value)}</text>`;
      }

      if (showNeg && localMin.value < 0) {
        const yy = y(localMin.value);
        const xx = x(minIndex) + barW/2;
        const pctUsed = Math.round(Math.abs(localMin.value) / OVERDRAFT_LIMIT * 100);
        out += `<circle cx="${xx}" cy="${yy}" r="4" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>`;
        out += `<text x="${xx}" y="${Math.min(height-margin.bottom-30, yy+18)}" text-anchor="middle" fill="#b91c1c" class="peak-label">${localMin.label}</text>`;
        out += `<text x="${xx}" y="${Math.min(height-margin.bottom-18, yy+31)}" text-anchor="middle" fill="#b91c1c" class="peak-label">${fmtMoney(localMin.value)}</text>`;
        out += `<text x="${xx}" y="${Math.min(height-margin.bottom-6, yy+44)}" text-anchor="middle" fill="#991b1b" font-weight="800" class="peak-label">${pctUsed}% del límite</text>`;
      }
    });
  }

  const highlightGroups = {};
  HIGHLIGHTS.forEach(h => {
    if (!highlightGroups[h.date]) highlightGroups[h.date] = [];
    highlightGroups[h.date].push(h.label);
  });
  Object.keys(highlightGroups).forEach(date => {
    const idx = rows.findIndex(r => r.date === date);
    if (idx < 0) return;
    const xx = x(idx) + barW/2;
    const topY = margin.top + 4;
    const bottomY = height - margin.bottom + 8;
    out += `<line x1="${xx}" y1="${topY}" x2="${xx}" y2="${bottomY}" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="3 3" opacity=".85"/>`;
    out += `<circle cx="${xx}" cy="${topY}" r="3" fill="#7c3aed" stroke="#ffffff" stroke-width="1.2"/>`;
    highlightGroups[date].forEach((label, i) => {
      const ly = topY + 14 + i*14;
      out += `<text x="${xx}" y="${ly}" text-anchor="middle" font-size="10" font-weight="800" fill="#6d28d9" class="peak-label">${label}</text>`;
    });
  });

  const inflowGroups = {};
  INFLOWS.forEach(h => {
    if (!inflowGroups[h.date]) inflowGroups[h.date] = [];
    inflowGroups[h.date].push(h.label);
  });
  Object.keys(inflowGroups).forEach(date => {
    const idx = rows.findIndex(r => r.date === date);
    if (idx < 0) return;
    const xx = x(idx) + barW/2;
    const topY = margin.top + 4;
    const bottomY = height - margin.bottom + 8;
    out += `<line x1="${xx}" y1="${topY}" x2="${xx}" y2="${bottomY}" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="2 3" opacity=".9"/>`;
    out += `<circle cx="${xx}" cy="${topY}" r="3.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.2"/>`;
    inflowGroups[date].forEach((label, i) => {
      const ly = topY + 14 + i*14;
      out += `<text x="${xx}" y="${ly}" text-anchor="middle" font-size="10" font-weight="800" fill="#c2410c" class="peak-label">${label}</text>`;
    });
  });

  const every = Math.max(1, Math.ceil(rows.length / 24));
  rows.forEach((r,i) => {
    if(i % every !== 0 && i !== rows.length-1) return;
    out += `<text x="${x(i)+barW/2}" y="${height-margin.bottom+22}" text-anchor="end" transform="rotate(-55 ${x(i)+barW/2} ${height-margin.bottom+22})" font-size="9" fill="#6b7280">${r.label}</text>`;
  });

  svg.innerHTML = out;

  svg.querySelectorAll(".bar").forEach(el => {
    el.addEventListener("mousemove", ev => {
      const r = rows[+el.dataset.i];
      tip.style.opacity = 1;
      tip.style.left = ev.clientX + "px";
      tip.style.top = ev.clientY + "px";
      const pctLine = r.value < 0 ? `<br>${Math.round(Math.abs(r.value)/OVERDRAFT_LIMIT*100)}% del límite de descubierto` : "";
      tip.innerHTML = `<strong>${r.month} · ${r.label}</strong><br>${fmtExact(r.value)}${pctLine}`;
      el.setAttribute("opacity","0.72");
    });
    el.addEventListener("mouseleave", () => {
      tip.style.opacity = 0;
      el.setAttribute("opacity","0.96");
    });
  });
}

draw();

function buildExecSummary() {
  const box = document.getElementById("execSummary");
  if (!box) return;

  const parseISO = s => { const [yy,mm,dd] = s.split("-").map(Number); return new Date(yy,mm-1,dd); };
  const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);

  const monthStats = DATA.map(month => {
    const rows = month.rows;
    const vals = rows.map(r=>r.value);
    const minVal = Math.min(...vals);
    const minRow = rows.find(r=>r.value===minVal);
    const maxVal = Math.max(...vals);
    const maxRow = rows.find(r=>r.value===maxVal);
    const close = vals[vals.length-1];
    const negDays = rows.filter(r=>r.value<0).length;
    const pctNeg = Math.round(negDays/rows.length*100);
    const pctLimit = Math.round(Math.abs(minVal)/OVERDRAFT_LIMIT*100);
    const event = HIGHLIGHTS.find(h=>h.date===minRow.date);

    let best=null, i=0;
    while (i<rows.length) {
      if (rows[i].value<0) {
        const start=i;
        while(i+1<rows.length && rows[i+1].value<0) i++;
        const end=i;
        const runRows = rows.slice(start,end+1);
        const recovery = (end+1<rows.length && rows[end+1].value>=0) ? rows[end+1] : null;
        const calSpan = daysBetween(runRows[0].date, runRows[runRows.length-1].date)+1;
        const calToRecovery = recovery ? daysBetween(runRows[0].date, recovery.date) : null;
        if (!best || runRows.length>best.obsDays) best = {obsDays:runRows.length, calSpan, startLabel:runRows[0].label, endLabel:runRows[runRows.length-1].label, recovery, calToRecovery};
      }
      i++;
    }
    return {label:month.label, minVal, minLabel:minRow.label, maxVal, maxLabel:maxRow.label, close, negDays, totalDays:rows.length, pctNeg, pctLimit, event: event?event.label:null, run:best};
  });

  const worstMonth = monthStats.reduce((a,b)=>a.minVal<b.minVal?a:b);
  const dec = monthStats[monthStats.length-1];
  const overallNegDays = DATA.reduce((s,m)=>s+m.rows.filter(r=>r.value<0).length,0);
  const overallDays = DATA.reduce((s,m)=>s+m.rows.length,0);
  const f931Matches = monthStats.filter(m=>m.event && m.event.includes("F 931")).length;
  const decRecovers = !!dec.run.recovery;
  const worstOverallMonth = monthStats.reduce((a,b)=>a.pctLimit>b.pctLimit?a:b);
  const monthsOver60 = monthStats.filter(m=>m.pctLimit>=60).map(m=>m.label);

  box.innerHTML = `
    <h2>Resumen</h2>

    <div class="exec-table-wrap">
      <table class="exec-table">
        <thead>
          <tr>
            <th>Mes</th>
            <th>Días en rojo</th>
            <th>Pico negativo</th>
            <th>Pico positivo</th>
            <th>% descubierto usado</th>
          </tr>
        </thead>
        <tbody>
          ${monthStats.map(m => `
            <tr class="${m.pctLimit>=60?'crit':''}">
              <td><strong>${m.label}</strong></td>
              <td>${m.negDays} de ${m.totalDays} (${m.pctNeg}%)</td>
              <td class="neg-c">${fmtMoney(m.minVal)} (${m.minLabel})</td>
              <td class="pos-c">${fmtMoney(m.maxVal)} (${m.maxLabel})</td>
              <td class="${m.pctLimit>=60?'neg-c':''}">${m.pctLimit}%</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>

    <div class="conclusion-box">
      <p>El patrón se repite mes tras mes: entra plata los primeros días, se paga sueldos alrededor del cuarto día hábil y ahí arranca el pozo. En ${f931Matches} de los 6 meses el fondo real no lo toca el día de sueldos sino unos días después, cuando se suma F 931 — ahí es donde más aprieta. IIBB e IVA, que vencen recién a mediados/fin de mes, en general ya encuentran la cuenta recuperando y no suman tanto.</p>
      <p>Diciembre es el mes más largo en rojo: ${dec.run.calSpan} días seguidos en déficit, del ${dec.run.startLabel} al ${dec.run.endLabel}${decRecovers ? ", y recién vuelve a positivo el último día del año" : ", sin volver a positivo en todo el mes"}.</p>
      <p>El ingreso de <b>$550.000.000</b> por la devolución de la caución el 18/08 pesa bastante en esta lectura: como es saldo de caja, se arrastra para adelante y sostiene todos los meses siguientes. Buena parte de la mejora que se ve entre septiembre y diciembre frente a un escenario sin ese ingreso viene de ahí.</p>
      <p class="conclusion-risk">${dec.close<0
        ? `Si noviembre y diciembre siguen esta curva, enero 2027 arrancaría directamente en negativo, lo que deja menos margen contra el límite de ${fmtMoney(-OVERDRAFT_LIMIT)}.`
        : `Diciembre cierra en positivo (${fmtMoney(dec.close)}), pero recién el último día y después de ${dec.run.calSpan} jornadas seguidas en déficit, llegando a usar hasta el ${dec.pctLimit}% del límite. El margen contra los ${fmtMoney(-OVERDRAFT_LIMIT)} sigue siendo justo en ese tramo del año.`
      }</p>
    </div>
  `;
}
buildExecSummary();
</script>
