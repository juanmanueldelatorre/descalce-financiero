<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#00111f;--panel:#021a2e;--line:#0a2440;--grid:#0d2a47;--text:#e8eef9;--muted:#8ea2bd;--dim:#5f7593;--blue:#0e83f6;--pos:#22c55e;--neg:#ef4444;--warn:#fbbf24;--proj:#fb923c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
nav{width:220px;flex:none;border-right:1px solid var(--line);background:#000e1a;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand svg{width:26px;height:24px}.brand b{display:block;font-size:13.5px;letter-spacing:.08em}.brand small{display:block;font-size:11px;color:var(--muted)}
.sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:6px 10px;font-weight:700}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#b8c8df;font-size:13px}
nav button svg{width:16px;height:16px;opacity:.85}
nav button:hover{background:#071f36;color:#fff}
nav button.on{background:#0a2a4a;color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
nav button:focus-visible{outline:2px solid var(--blue)}
.foot{margin-top:auto;font-size:11px;color:var(--dim);padding:0 10px}
main{flex:1;min-width:0;padding:26px 36px 48px;max-width:1400px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:#041f36;border:1px solid #0b2c4a;border-radius:20px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:#7f93ad;padding:5px 12px;border-radius:16px;white-space:nowrap}
.seg button:hover{color:var(--text)}.seg button.on{background:#09304f;color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--blue)}
input[type=date]{background:#041f36;color:var(--text);border:1px solid #0b2c4a;border-radius:8px;padding:5px 8px;font:inherit;font-size:12px;color-scheme:dark}
.kpis{display:grid;grid-template-columns:repeat(var(--n,5),1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.kpis>div{padding:14px 16px;border-left:1px solid var(--line)}.kpis>div:first-child{border-left:0}
.kpis span{display:block;font-size:11px;color:var(--muted)}

.kpis small{font-size:10.5px;color:var(--dim)}
.p{color:#4ade80}.n{color:#f87171}.w{color:var(--warn)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;position:relative}
.chart{height:460px;position:relative}
.chart svg{display:block;width:100%;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:8px 2px 2px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leg i.ln{height:2px;border-radius:0;vertical-align:3px;width:16px}
.leg i.dash{height:0;border-top:2px dashed var(--proj);background:none;vertical-align:3px;width:16px}
.tip{position:absolute;pointer-events:none;background:#031c31;border:1px solid #16406a;border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap;box-shadow:0 8px 24px #0008;opacity:0;transition:opacity .1s;z-index:5}
.tip b{font-variant-numeric:tabular-nums}.tip .t{color:var(--muted);font-size:11px;margin-bottom:3px}
.note{font-size:11px;color:var(--dim);margin:12px 0 0}
.det{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.det h3{margin:0 0 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.det table{width:100%;border-collapse:collapse;font-size:12.5px}
.det td{padding:6px 0;border-top:1px solid var(--line)}
.det td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;vertical-align:top}
.det .bar{height:3px;border-radius:2px;margin-top:4px}
.det .hint{color:var(--dim);font-size:12px}
section[hidden]{display:none}
@media(max-width:900px){
 .app{display:block}
 nav{width:auto;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);z-index:9}

 .kpis>div:last-child:nth-child(odd){grid-column:1/-1;border-left:0}
 .chart{height:360px}
 .det{grid-template-columns:1fr}
}

const dl=s=>(+s.slice(6))+'/'+(+s.slice(4,6));

$('footNote').textContent='Saldo real al '+dlY(T0)+' · proyección del flujo cruzado';

/* ---------- FLUJO DE FONDOS ---------- */
const SAL=DATA.sal,PROJ=DATA.proj,PM=Object.fromEntries(PROJ);
let FF_M=3;
function ffKpis(){const at=n=>{const d=add(TODAY,n);const r=PROJ.filter(x=>x[0]<=d).at(-1);return r};

function ffChart(){const box=$('ffC'),W=box.clientWidth,H=box.clientHeight,tip=$('ffT');

 let lo=Math.min(0,-lim,...pts.map(p=>p.v)),hi=Math.max(0,...pts.map(p=>p.v));const pad=(hi-lo)*.06;lo-=pad;hi+=pad;

 ticks(lo,hi).forEach(v=>{s+=el('line',{x1:mL,x2:W-mR,y1:Y(v),y2:Y(v),stroke:v===0?'#2a4a6c':'#0b2540'})+el('text',{x:mL-8,y:Y(v)+3.5,fill:'#5f7593','font-size':10.5,'text-anchor':'end'},fAx(v))});
 // limit
 s+=el('line',{x1:mL,x2:W-mR,y1:Y(-lim),y2:Y(-lim),stroke:'#f87171','stroke-dasharray':'5 4','stroke-width':1.2,opacity:.8})+el('text',{x:W-mR-4,y:Y(-lim)-6,fill:'#f87171','font-size':10.5,'text-anchor':'end'},'límite de descubierto '+fAx(-lim));
 // real bars
 pts.forEach((p,i)=>{if(!p.r)return;const y0=Y(0),y=Y(p.v);s+=el('rect',{x:X(i)-bw/2,y:Math.min(y,y0),width:bw,height:Math.max(1,Math.abs(y-y0)),rx:1.5,fill:p.v>=0?'#22c55e':'#ef4444',opacity:.9})});

 if(li.length>1){const fi=li.findIndex(i=>pts[i].d>=DATA.firstFut),split=fi<0?li.length:fi;
  const path=a=>a.map((i,k)=>(k?'L':'M')+X(i).toFixed(1)+' '+Y(pts[i].v).toFixed(1)).join('');
  const area='M'+X(li[0])+' '+Y(0)+li.map(i=>'L'+X(i).toFixed(1)+' '+Y(pts[i].v).toFixed(1)).join('')+'L'+X(li.at(-1))+' '+Y(0)+'Z';
  s+=`<defs><clipPath id="cAbove"><rect x="0" y="0" width="${W}" height="${Y(0)}"/></clipPath><clipPath id="cBelow"><rect x="0" y="${Y(0)}" width="${W}" height="${H}"/></clipPath></defs>`;
  s+=el('path',{d:area,fill:'#22c55e',opacity:.12,'clip-path':'url(#cAbove)'})+el('path',{d:area,fill:'#ef4444',opacity:.12,'clip-path':'url(#cBelow)'});
  const A=li.slice(0,split+1),B=li.slice(Math.max(0,split));
  if(A.length>1)s+=el('path',{d:path(A),fill:'none',stroke:'#fb923c','stroke-width':2.2,'stroke-linejoin':'round'});

  const last=pts[li.at(-1)];s+=el('text',{x:X(li.at(-1))+6,y:Y(last.v)+4,fill:last.v<0?'#f87171':'#4ade80','font-size':12,'font-weight':700},fAx(last.v));}
 // hoy

 // min marker

 // x labels
 const step=Math.ceil(N/(W/56));pts.forEach((p,i)=>{if(i%step===0&&Math.abs(i-ti)>step/2)s+=el('text',{x:X(i),y:H-mB+16,fill:'#5f7593','font-size':10,'text-anchor':'middle'},+p.d.slice(6))});

 box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flujo de fondos: saldo real y proyectado">${s}</svg>`;
 const svg=box.querySelector('svg'),cur=svg.querySelector('#ffCur');

  cur.setAttribute('x1',X(i));cur.setAttribute('x2',X(i));cur.setAttribute('opacity',.5);
  const d=toD(p.d).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
  tip.innerHTML=`<div class="t">${d} · ${p.r?'real':'proyectado'}</div><b class="${p.v<-lim?'n':p.v<0?'w':'p'}">${fM(p.v)}</b>${!p.r&&p.v<0?`<div class="t" style="margin:3px 0 0">margen de descubierto ${fM(lim+p.v)}</div>`:''}`;
  tip.style.opacity=1;const tx=X(i)+16,tw=tip.offsetWidth;tip.style.left=(tx+tw>W?X(i)-tw-16+16:tx+16)+'px';tip.style.top='40px'};

$('ffR').onclick=e=>{const b=e.target.closest('button');if(!b)return;FF_M=+b.dataset.m;[...$('ffR').children].forEach(x=>x.classList.toggle('on',x===b));ffChart()};

/* ---------- INGRESOS Y EGRESOS ---------- */
const DAY=DATA.day;let IE_G='m',IE_SEL=null;
const first=DAY[0][0],lastD=DAY.at(-1)[0];
$('ieFrom').min=$('ieTo').min=iso(first);$('ieFrom').max=$('ieTo').max=iso(lastD);
$('ieFrom').value=iso(T0.slice(0,4)+'0101');$('ieTo').value=iso(toS(new Date(+T0.slice(0,4),+T0.slice(4,6)+3,0)));
const wk=s=>{const d=toD(s),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return toS(d)};
function ieBuckets(){const f=$('ieFrom').value.replace(/-/g,''),t=$('ieTo').value.replace(/-/g,'');const B=new Map();
 DAY.forEach(([d,iR,eR,iP,eP])=>{if(d<f||d>t)return;const k=IE_G==='m'?d.slice(0,6):wk(d);if(!B.has(k))B.set(k,{k,iR:0,eR:0,iP:0,eP:0});const b=B.get(k);b.iR+=iR;b.eR+=eR;b.iP+=iP;b.eP+=eP});
 return [...B.values()].sort((a,b)=>a.k<b.k?-1:1)}
const bLab=k=>IE_G==='m'?MES[+k.slice(4,6)-1]+' '+k.slice(2,4):dl(k);
const bLong=k=>IE_G==='m'?MESL[+k.slice(4,6)-1]+' '+k.slice(0,4):'Semana del '+dlY(k);
function ieRender(){const B=ieBuckets(),box=$('ieC'),W=box.clientWidth,H=box.clientHeight,tip=$('ieT');
 const tI=B.reduce((a,b)=>a+b.iR+b.iP,0),tE=B.reduce((a,b)=>a+b.eR+b.eP,0),pI=B.reduce((a,b)=>a+b.iP,0),pE=B.reduce((a,b)=>a+b.eP,0);
 $('ieK').innerHTML=`<div><span>Ingresos</span><b class="p">${fM(tI)}</b><small>${pI?fM(pI)+' proyectado':'todo real'}</small></div><div><span>Egresos</span><b class="n">${fM(-tE)}</b><small>${pE?fM(-pE)+' proyectado':'todo real'}</small></div><div><span>Neto</span><b class="${tI-tE>=0?'p':'n'}">${fM(tI-tE)}</b><small>ingresos − egresos</small></div><div><span>Cobertura</span><b class="${tI>=tE?'p':'n'}">${tE?Math.round(tI/tE*100):0}%</b><small>ingresos / egresos</small></div>`;
 $('ieSub').textContent='Real hasta el '+dlY(T0)+' · después, proyectado';
 const N=B.length;if(!N){box.innerHTML='<p class="note" style="padding:20px">No hay datos en ese período.</p>';$('ieD').innerHTML='';return}
 const mL=52,mR=16,mT=18,mB=30,iw=W-mL-mR,ih=H-mT-mB;
 let hi=Math.max(...B.map(b=>Math.max(b.iR+b.iP,b.eR+b.eP)))*1.1,lo=0;
 const Y=v=>mT+(hi-v)/(hi-lo)*ih,cw=iw/N,bw=Math.min(30,cw*.36),gap=Math.min(4,cw*.06),X=i=>mL+(i+.5)*cw;
 let s='';ticks(lo,hi).forEach(v=>{s+=el('line',{x1:mL,x2:W-mR,y1:Y(v),y2:Y(v),stroke:v===0?'#2a4a6c':'#0b2540'})+el('text',{x:mL-8,y:Y(v)+3.5,fill:'#5f7593','font-size':10.5,'text-anchor':'end'},fAx(v))});
 // real/proj divider
 const di=B.findIndex(b=>b.iP+b.eP>0&&b.iR+b.eR===0);if(di>0){const x=mL+di*cw;s+=el('line',{x1:x,x2:x,y1:mT,y2:H-mB,stroke:'#0e83f6','stroke-dasharray':'3 4',opacity:.6})+el('text',{x:x+6,y:mT+10,fill:'#5f86b0','font-size':10,'font-weight':700,'letter-spacing':'.1em'},'PROYECTADO')}
 B.forEach((b,i)=>{const xi=X(i)-bw-gap/2,xe=X(i)+gap/2,y0=Y(0);
  const sel=IE_SEL===b.k,op=IE_SEL&&!sel?.35:1;
  s+=`<g opacity="${op}">`;
  let yA=Y(b.iR);s+=el('rect',{x:xi,y:yA,width:bw,height:Math.max(0,y0-yA),rx:2,fill:'#22c55e'});
  let yB=Y(b.iR+b.iP);if(b.iP)s+=el('rect',{x:xi,y:yB,width:bw,height:Math.max(0,yA-yB),rx:2,fill:'#22c55e',opacity:.4});
  let yC=Y(b.eR);s+=el('rect',{x:xe,y:yC,width:bw,height:Math.max(0,y0-yC),rx:2,fill:'#ef4444'});
  let yD=Y(b.eR+b.eP);if(b.eP)s+=el('rect',{x:xe,y:yD,width:bw,height:Math.max(0,yC-yD),rx:2,fill:'#ef4444',opacity:.4});
  const net=b.iR+b.iP-b.eR-b.eP;if(cw>58)s+=el('text',{x:X(i),y:Math.min(yB,yD)-7,fill:net>=0?'#4ade80':'#f87171','font-size':10.5,'font-weight':600,'text-anchor':'middle'},(net>=0?'+':'')+fAx(net));
  if(cw>34)s+=el('text',{x:X(i),y:H-mB+17,fill:sel?'#e8eef9':'#7f93ad','font-size':10.5,'text-anchor':'middle','font-weight':sel?700:400},bLab(b.k));
  s+='</g>';
  s+=el('rect',{x:mL+i*cw,y:mT,width:cw,height:ih,fill:'transparent','data-i':i,style:'cursor:'+(IE_G==='m'?'pointer':'default')})});
 if(cw<=34){const step=Math.ceil(34/cw);B.forEach((b,i)=>{if(i%step===0)s+=el('text',{x:X(i),y:H-mB+17,fill:'#7f93ad','font-size':10.5,'text-anchor':'middle'},bLab(b.k))})}
 box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos por período">${s}</svg>`;
 const svg=box.querySelector('svg');
 svg.onmousemove=e=>{const t=e.target.closest('[data-i]');if(!t){tip.style.opacity=0;return}const b=B[+t.dataset.i],i=+t.dataset.i,net=b.iR+b.iP-b.eR-b.eP;
  tip.innerHTML=`<div class="t">${bLong(b.k)}</div>Ingresos <b class="p">${fM(b.iR+b.iP)}</b>${b.iP&&b.iR?` <span class="t">(${fM(b.iP)} proy.)</span>`:''}<br>Egresos <b class="n">${fM(-(b.eR+b.eP))}</b><br>Neto <b class="${net>=0?'p':'n'}">${fM(net)}</b>${IE_G==='m'?'<div class="t" style="margin:4px 0 0">clic para ver el detalle</div>':''}`;
  tip.style.opacity=1;const tw=tip.offsetWidth;let l=X(i)+bw+20;if(l+tw>W)l=X(i)-bw-tw-10;tip.style.left=l+'px';tip.style.top='30px'};

function ieDet(B){const D=$('ieD');if(IE_G!=='m'){D.innerHTML='<p class="note">El detalle por concepto está en la vista mensual.</p>';return}

 const tbl=(rows,col,lab)=>{const tot=rows.reduce((a,r)=>a+r[1],0),adj=rows.filter(r=>r[0]==='Reintegros y ajustes'),pos=rows.filter(r=>r[0]!=='Reintegros y ajustes'),top=pos.slice(0,10),rest=pos.slice(10).reduce((a,r)=>a+r[1],0);if(rest)top.push(['Resto ('+(pos.length-10)+')',rest]);const aj=adj.reduce((a,r)=>a+r[1],0);if(Math.abs(aj)>1)top.push(['Reintegros y ajustes',aj]);const mx=top.length?Math.max(...top.map(r=>Math.abs(r[1]))):1;
  return `<div class="card"><h3><span>${lab}</span><span class="${col==='#22c55e'?'p':'n'}">${fM(col==='#22c55e'?tot:-tot)}</span></h3><table>${top.map(([n,v])=>`<tr><td>${n.replace(/</g,'&lt;')}<div class="bar" style="width:${Math.abs(v)/mx*100}%;background:${col};opacity:.55"></div></td><td>${fM(v)}</td></tr>`).join('')}</table></div>`};
 D.innerHTML=tbl(agg('i'),'#22c55e','Ingresos por concepto · '+(IE_SEL?bLong(IE_SEL):'todo el período'))+tbl(agg('e'),'#ef4444','Egresos por concepto · '+(IE_SEL?bLong(IE_SEL):'todo el período'))}
$('ieG').onclick=e=>{const b=e.target.closest('button');if(!b)return;IE_G=b.dataset.g;IE_SEL=null;[...$('ieG').children].forEach(x=>x.classList.toggle('on',x===b));ieRender()};
$('ieFrom').onchange=$('ieTo').onchange=()=>{IE_SEL=null;ieRender()};

/* ---------- navegación ---------- */
function show(s){document.querySelectorAll('nav [data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('ff').hidden=s!=='ff';$('ie').hidden=s!=='ie';s==='ff'?ffChart():ieRender();try{history.replaceState(null,'','#'+s)}catch(_){}}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-s]');if(b)show(b.dataset.s)};
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>show($('ff').hidden?'ie':'ff'),120)});
ffKpis();show(location.hash==='#ie'?'ie':'ff');
</script></body></html>
